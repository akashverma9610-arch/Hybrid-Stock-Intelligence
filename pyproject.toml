[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nse-stock-manager"
version = "0.1.0"
description = "Deterministic local data foundation for NSE Stock Manager"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2,<3",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "keyring>=25,<26",
    "pywin32>=306,<312; sys_platform == 'win32'",
    "pyotp>=2.9,<3",
    "kotakneoapi>=3.0.1,<4",
    "python-multipart>=0.0.20,<1",
    "requests>=2.31,<3",
    "yfinance>=0.2.66,<1",
    "PyJWT[crypto]>=2.13,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "openpyxl>=3.1,<4"]

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[tool.setuptools.package-data]
"app.lens_knowledge" = ["*.json", "taxonomy/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
